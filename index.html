<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CodeBench</title>
</head>

<body>

    <h1>CodeBench</h1>

    <textarea
        id="code"
        rows="15"
        cols="80"
        placeholder="Write your C++ code here..."
>#include <iostream>
using namespace std;

int main() {
    int a = 10;
    int b = 20;


    return 0;
}</textarea>

    <br><br>

    <button onclick="runCode()">
        Run Code
    </button>

    <h3>Output:</h3>

    <pre id="output">Output will appear here...</pre>

    <script src="app.js"></script>

</body>

</html>
